<!DOCTYPE html>
<html>

<head>

    <title>User Last Login Tracking</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>User Last Login Tracking</h1>

    <p>
        Enter your name to log in and view
        your last login information.
    </p>

    <form action="process.php" method="post">

        <label>User Name</label>

        <input type="text"
               name="user_name"
               placeholder="Enter your name"
               required>

        <input type="submit"
               value="Login">

    </form>

</div>

</body>

</html>
