<!DOCTYPE html>
<html>

<head>

    <title>Cloud Document Directory Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Cloud Document Directory Management</h1>

    <p>
        Upload, store, retrieve, and delete documents.
    </p>


    <h2>Upload Document</h2>

    <form action="process.php"
          method="post"
          enctype="multipart/form-data">

        <label>Select Document</label>

        <input type="file"
               name="document"
               required>


        <label>Select Directory</label>

        <select name="category"
                required>

            <option value="">
                Select Directory
            </option>

            <option value="reports">
                Reports
            </option>

            <option value="assignments">
                Assignments
            </option>

            <option value="documents">
                General Documents
            </option>

        </select>


        <input type="submit"
               name="upload"
               value="Upload Document">

    </form>


    <h2>Delete Document</h2>

    <form action="process.php"
          method="post">

        <label>Enter File Name</label>

        <input type="text"
               name="file_name"
               placeholder="Enter file name to delete"
               required>


        <input type="submit"
               name="delete"
               value="Delete Document">

    </form>

</div>

</body>

</html>
