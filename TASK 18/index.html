<!DOCTYPE html>
<html>

<head>

    <title>Student Records Backup System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Student Records Backup System</h1>

    <p>
        Enter student details to store the record
        and create a backup automatically.
    </p>


    <h2>Student Record Form</h2>

    <form action="process.php" method="post">

        <label>Student Name</label>

        <input type="text"
               name="student_name"
               placeholder="Enter student name"
               required>


        <label>Register Number</label>

        <input type="text"
               name="register_number"
               placeholder="Enter register number"
               required>


        <label>Department</label>

        <input type="text"
               name="department"
               placeholder="Enter department"
               required>


        <label>Year</label>

        <input type="number"
               name="year"
               min="1"
               max="4"
               placeholder="Enter year"
               required>


        <input type="submit"
               value="Save and Create Backup">

    </form>

</div>

</body>

</html>
