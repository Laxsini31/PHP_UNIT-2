<!DOCTYPE html>
<html>

<head>

    <title>Employee Attendance File Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Employee Attendance File Management</h1>

    <p>
        Enter employee attendance details to store
        and retrieve attendance records.
    </p>


    <h2>Store Attendance Record</h2>

    <form action="process.php" method="post">

        <input type="hidden"
               name="action"
               value="store">

        <label>Employee ID</label>

        <input type="text"
               name="employee_id"
               placeholder="Enter employee ID"
               required>


        <label>Employee Name</label>

        <input type="text"
               name="employee_name"
               placeholder="Enter employee name"
               required>


        <label>Date</label>

        <input type="date"
               name="attendance_date"
               required>


        <label>Attendance Status</label>

        <select name="status" required>

            <option value="">
                Select Status
            </option>

            <option value="Present">
                Present
            </option>

            <option value="Absent">
                Absent
            </option>

            <option value="Leave">
                Leave
            </option>

        </select>


        <input type="submit"
               value="Store Attendance">

    </form>


    <h2>View Attendance Records</h2>

    <form action="process.php" method="post">

        <input type="hidden"
               name="action"
               value="view">

        <input type="submit"
               value="View All Records">

    </form>

</div>

</body>

</html>
